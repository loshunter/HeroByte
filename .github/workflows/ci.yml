name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  schedule:
        # Nightly full E2E run on dev (02:30 UTC). The full suite now also runs on
    # push and pull_request, so this is a backstop rather than the only place
    # those specs execute.
    - cron: "30 2 * * *"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint checks
        run: pnpm lint

      # ESLint enforces prettier via the prettier/prettier rule, but each
      # package only lints its own src/, so apps/e2e (no package.json, not a
      # workspace member), scripts/ and root docs were never checked and drifted
      # freely. Seconds to run, and it is what would have caught that drift.
      - name: Check formatting
        run: pnpm format:check

      - name: Enforce structural guardrails
        run: pnpm lint:structure:enforce

      - name: Generate structural report
        if: always()
        run: pnpm lint:structure | tee structure-report.txt

      - name: Generate structural report artifact
        run: node scripts/structure-report.mjs --limit 200 --threshold 350 --json > structure-report.json

      - name: Upload structural report
        uses: actions/upload-artifact@v7
        with:
          name: structure-report
          path: |
            structure-report.txt
            structure-report.json
          if-no-files-found: ignore

      - name: Build packages
        run: pnpm build

      # Production code is typechecked by the build. This additionally checks
      # test files, which package build tsconfigs intentionally exclude.
      - name: Typecheck (including test files)
        run: pnpm typecheck

      - name: Check bundle size (client)
        run: node apps/client/scripts/check-bundle-size.mjs

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    strategy:
      fail-fast: false
      matrix:
        package: [shared, server, client]
        node-version: [18.x, 20.x]
        include:
          - package: shared
            test-command: pnpm test:shared:coverage
            coverage-path: packages/shared/coverage/coverage-final.json
          - package: server
            test-command: pnpm test:server:coverage
            coverage-path: apps/server/coverage/coverage-final.json
          - package: client
            test-command: pnpm test:client:coverage
            coverage-path: apps/client/coverage/coverage-final.json
            node-options: --max-old-space-size=8192
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run ${{ matrix.package }} tests with coverage
        run: ${{ matrix.test-command }}
        env:
          NODE_OPTIONS: ${{ matrix.node-options || '' }}
          # Batched test runner settings (auto-detects CI, these are explicit overrides)
          CLIENT_TEST_CHUNK_SIZE: 10
          CLIENT_TEST_CONCURRENCY: 4
          # Coverage-specific batching settings
          CLIENT_COVERAGE_CHUNK_SIZE: 10
          CLIENT_COVERAGE_CONCURRENCY: 4

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: matrix.node-version == '20.x'
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.coverage-path }}
          retention-days: 1

  e2e-smoke-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests (stable only)
        run: pnpm exec playwright test apps/e2e/smoke.spec.ts apps/e2e/character-creation.smoke.spec.ts apps/e2e/session-load.smoke.spec.ts apps/e2e/partial-erase.smoke.spec.ts

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots, videos)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  e2e-full-suite:
        # Runs on EVERY trigger, including push and pull_request. It used to be
    # scheduled/manual only, which meant the specs a slice shipped with never
    # ran on the branch that shipped them — S8 added 456 lines of e2e and cited
    # their counts as its verification, and none of them executed on a push.
    # The nightly cron below still runs, as a backstop for a red branch nobody
    # pushed to. e2e-smoke-tests is now a strict subset and is kept only for
    # the faster first signal; dropping it costs nothing but that.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The nightly cron fires on the DEFAULT branch (main), but this job is
          # a backstop for dev — hence the pin, for that trigger only. Every
          # other trigger must test what was actually pushed: an unconditional
          # `ref: dev` meant a push to main, or a PR targeting it, ran this
          # suite against dev's tree and reported the result as main's. An empty
          # string is checkout's own default, i.e. the event's ref/SHA.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bounded because this step hung for 29m53s on run #796 and ate the whole
      # job budget, so the suite never ran and the result read as `cancelled`
      # rather than as a failure. It normally takes 21s-2m; --with-deps shells
      # out to apt-get, which is what stalls. Ten minutes fails fast, says which
      # step did it, and still leaves twenty for the suite itself.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full E2E suite
        run: pnpm exec playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots, videos)
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-full
          path: test-results/
          retention-days: 7

  upload-coverage:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: |
            coverage-artifacts/coverage-shared/coverage-final.json
            coverage-artifacts/coverage-server/coverage-final.json
            coverage-artifacts/coverage-client/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: false
