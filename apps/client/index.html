    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://herobyte.app/" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://media.discordapp.net https://i.imgur.com __HB_SERVER_ORIGINS__; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://api.imgur.com __HB_SERVER_ORIGINS__; base-uri 'self'; object-src 'none';" />
    <meta name="theme-color" content="#0b0d12" />
    <meta property="og:title" content="HeroByte - Virtual Tabletop" />
    <meta
      property="og:description"
      content="Roll dice, move tokens, and share adventures online with HeroByte's retro-inspired virtual tabletop."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://herobyte.app/" />
    <meta property="og:image" content="/logo-wide.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HeroByte - Virtual Tabletop" />
    <meta
      name="twitter:description"
      content="Roll dice, move tokens, and share adventures online with HeroByte's retro virtual tabletop."
    />
    <meta name="twitter:image" content="/logo-wide.webp" />
    <title>HeroByte - Virtual Tabletop</title>
    <!--
      Generated icon set (assets/images/logo/favicon_io), each size rendered at
      its target rather than downscaled from one file at request time — which is
      what keeps the "HB" legible at 16 and 32px instead of resampling to mush.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body style="margin:0;background:#0b0d12;color:#dbe1ff;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <main id="root"></main>
    <script>
      // BOOT WATCHDOG. The app is an ES-module graph, and ONE failed chunk
      // fetch kills the whole graph silently: no error boundary (those live
      // inside React, which never ran), no retry, a permanently blank page.
      // Not hypothetical — reproduced 2026-08-30 with full network forensics:
      // index.js 200, vendor-react 200, vendor-konva 200, vendor-voice
      // net::ERR_CONNECTION_FAILED (one refused connection between two that
      // succeeded), mounted:false. It was also the e2e suite's only recurring
      // flake, ~1 in 1900 page loads across 41 preserved runs.
      //
      // If the mount point is still empty well after load, reload ONCE
      // (sessionStorage-guarded, so a genuinely broken deploy cannot loop);
      // if the retry fails too, say so visibly instead of staying blank.
      // The module graph executes before `load` fires (modules are deferred),
      // so on a healthy boot the root is already filled when this timer is
      // armed and the check is a no-op.
      (function () {
        var KEY = "herobyte-boot-retried";
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) {
              try {
                sessionStorage.removeItem(KEY);
              } catch (ignored) {}
              return;
            }
            var retried = false;
            try {
              retried = sessionStorage.getItem(KEY) === "1";
            } catch (ignored) {}
            if (!retried) {
              try {
                sessionStorage.setItem(KEY, "1");
              } catch (ignored) {}
              location.reload();
              return;
            }
            if (root) {
              root.innerHTML =
                '<div style="font-family:system-ui,sans-serif;max-width:28rem;margin:20vh auto;padding:0 1rem;text-align:center;">' +
                "<h1 style=\"font-size:1.2rem;\">HeroByte didn't load</h1>" +
                '<p>Part of the app failed to download. Check your connection, then refresh to try again.</p>' +
                "</div>";
            }
          }, 4000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
